AWSTemplateFormatVersion: "2010-09-09"

# benchmark/cases/case-010-missing-deletion-protection/template.yaml
#
# DELIBERATELY DEFECTIVE. Do not deploy this template, and do not copy it into a
# real stack. It exists to be reviewed. The clean, copyable samples are under
# examples/.
#
# Deliberate defects, one per resource:
#
#   OrdersDatabase     no DeletionProtection property. The property defaults to
#                      false, so leaving it out is the same outcome as switching it
#                      off, only less visible in review.
#   InventoryDatabase  DeletionProtection: false, the explicit form of the same
#                      defect.
#
# Both are reported by rules/backup/rds_deletion_protection.guard, which requires
# the property to be true rather than merely present -- the reason the absent and
# the explicit shapes produce the same finding.
#
# Both instances declare DeletionPolicy and UpdateReplacePolicy: Snapshot, and that
# is not a mitigation of the defect. Those attributes tell CloudFormation to take a
# final snapshot when the stack removes or replaces the instance; DeletionProtection
# is an RDS API setting that refuses the delete call in the first place, including
# a call made outside CloudFormation. The two controls answer different questions,
# so the rule fires with both attributes set.
#
# Both instances are otherwise correctly configured: storage encryption on, a seven
# day backup window, no public endpoint, Environment and Owner tags. The backup
# window matters here because rds_backup_retention is the other rule in the backup
# category, and the report merges findings on resource plus category -- an instance
# missing both would produce one finding rather than two and the case would no
# longer isolate deletion protection. That defect is measured by case-006. The
# master password is managed by RDS in Secrets Manager rather than written here: a
# benchmark template is published, so it carries no credential of any shape.

Description: >-
  Benchmark case 010. Two RDS DB instances without deletion protection, one
  leaving the property out and one setting it to false.

Parameters:
  DatabaseSubnetGroupName:
    Type: String
    Description: >-
      Name of an existing DB subnet group of private subnets for both database
      instances.
    MinLength: 1

Resources:
  OrdersDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceClass: db.t3.micro
      Engine: postgres
      AllocatedStorage: "20"
      # DeletionProtection is deliberately absent. This is the defect: the
      # property defaults to false, so an accidental stack update or a delete
      # call made straight to the RDS API removes the instance.
      StorageEncrypted: true
      MasterUsername: orders_admin
      # No password is written down: RDS creates and rotates one in Secrets
      # Manager. Benchmark templates carry no credential of any shape.
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroupName
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      Tags:
        - Key: Environment
          Value: production
        - Key: Owner
          Value: benchmark-case-010

  InventoryDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceClass: db.t3.micro
      Engine: postgres
      AllocatedStorage: "20"
      # The same defect written out. This is the defect: an explicit false is what
      # the absent property above already means.
      DeletionProtection: false
      StorageEncrypted: true
      MasterUsername: inventory_admin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroupName
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      Tags:
        - Key: Environment
          Value: production
        - Key: Owner
          Value: benchmark-case-010

Outputs:
  OrdersDatabaseEndpoint:
    Description: Endpoint of the instance that declares no deletion protection.
    Value: !GetAtt OrdersDatabase.Endpoint.Address

  InventoryDatabaseEndpoint:
    Description: Endpoint of the instance with deletion protection switched off.
    Value: !GetAtt InventoryDatabase.Endpoint.Address
