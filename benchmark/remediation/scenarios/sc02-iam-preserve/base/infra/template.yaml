# Synthetic fixture for SC-02 (not data from a real account or a published
# experiment). The ingest role's inline policy holds one statement the SC-02
# contract defines as over-broad (Allow of every action on every resource) and
# one statement the job needs (Sid ReadInput). The contract asks to remove the
# first and keep the second exactly as it is.
AWSTemplateFormatVersion: "2010-09-09"
Description: Ingest job (synthetic SC-02 fixture)
Resources:
  InputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ingest
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadInput
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${InputBucket.Arn}/*"
              - Sid: Everything
                Effect: Allow
                Action: "*"
                Resource: "*"
  IngestFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt IngestRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return None
      Environment:
        Variables:
          INPUT_BUCKET: !Ref InputBucket
Outputs:
  IngestRoleArn:
    Value: !GetAtt IngestRole.Arn
